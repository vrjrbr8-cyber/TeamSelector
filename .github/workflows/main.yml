
name: Team Selector - NeoForge Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check project
        run: |
          echo "Checking project files..."
          ls -la
          find . -maxdepth 3 -type f | sort | head -200

          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing"
            exit 1
          fi

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle is missing"
            exit 1
          fi

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::build.gradle is missing"
            exit 1
          fi

      - name: Compile mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace

      - name: Find JAR
        run: |
          find build/libs -type f -name "*.jar" -ls
          test -n "$(find build/libs -type f -name '*.jar' -print -quit)"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: TeamSelector-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
