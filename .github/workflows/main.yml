
name: Team Selector - Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verificar projeto
        run: |
          echo "Arquivos encontrados:"
          find . -maxdepth 4 -type f \
            ! -path './.git/*' | sort

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::Projeto NeoForge não encontrado: falta settings.gradle"
            exit 1
          fi

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::Falta build.gradle"
            exit 1
          fi

      - name: Compilar mod
        run: gradle --no-daemon clean build

      - name: Localizar JAR
        run: |
          find build/libs -type f -name "*.jar" -ls
          test -n "$(find build/libs -type f -name '*.jar' -print -quit)"

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: TeamSelector-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
